<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum Chess 5×5</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="blue">
<header class="topbar">
  <a class="brand" href="#play"><span class="logo">⟨ψ|</span> Quantum Chess <span class="tag" id="modeTag">5×5</span></a>
  <nav class="nav" aria-label="Sections">
    <a href="#play" data-route="play">Play</a>
    <a href="#manual" data-route="manual">How to play</a>
    <a href="#blog" data-route="blog">Classical vs Quantum</a>
  </nav>
  <div class="top-actions">
    <span class="engine-pill" id="enginePill" title="Which engine computes the quantum state">…</span>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings" title="Settings">⚙</button>
  </div>
</header>

<!-- ============================================================ PLAY -->
<main id="view-play" class="view layout">
  <section class="board-col">
    <div class="player-bar" id="barTop">
      <div class="avatar black"></div>
      <div class="pname" id="nameTop">Black</div>
      <div class="captured" id="capTop"></div>
      <div class="turn-dot" id="dotTop"></div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" aria-label="Chess board"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <div id="overlayTitle" class="overlay-title"></div>
          <div id="overlaySub" class="overlay-sub"></div>
          <button class="primary" id="overlayNew">Play again</button>
        </div>
      </div>
    </div>

    <div class="player-bar" id="barBottom">
      <div class="avatar white"></div>
      <div class="pname" id="nameBottom">White</div>
      <div class="captured" id="capBottom"></div>
      <div class="turn-dot" id="dotBottom"></div>
    </div>
  </section>

  <aside class="panel">
    <div class="panel-head">
      <div class="status" id="status">White to move</div>
      <div class="qubits" id="qubits" title="Qubits currently in the statevector">0 qubits</div>
    </div>

    <div class="modes" role="tablist" aria-label="Move type">
      <button class="mode active" data-mode="move"><span class="mi">♞</span>Move</button>
      <button class="mode" data-mode="split"><span class="mi">⑂</span>Split</button>
      <button class="mode" data-mode="merge"><span class="mi">⧉</span>Merge</button>
    </div>
    <div class="hint" id="hint">Select a piece to see where it can go.</div>

    <div class="card">
      <div class="card-title">Moves</div>
      <ol id="moves" class="moves"></ol>
    </div>

    <div class="card circuit-card">
      <div class="card-title" id="circuitTitle">Circuit · last move</div>
      <div id="circuit" class="circuit"><span class="muted">Quantum moves show their circuit here.</span></div>
    </div>

    <div class="buttons">
      <button class="primary" id="newQuantum">New quantum game</button>
      <button class="secondary" id="newClassical" title="Same engine with split and merge switched off">Classical baseline</button>
    </div>
  </aside>
</main>

<!-- ============================================================ MANUAL -->
<main id="view-manual" class="view doc hidden">
  <article class="article" id="manualBody"></article>
</main>

<!-- ============================================================ BLOG -->
<main id="view-blog" class="view doc hidden">
  <article class="article" id="blogBody"></article>
</main>

<!-- ============================================================ SETTINGS -->
<dialog id="settings" class="sheet">
  <div class="sheet-head">
    <h2>Settings</h2>
    <form method="dialog"><button class="icon-btn" aria-label="Close">✕</button></form>
  </div>

  <section class="set-group">
    <h3>Board theme</h3>
    <div class="themes" id="themes"></div>
  </section>

  <section class="set-group">
    <h3>Display</h3>
    <label class="toggle"><input type="checkbox" data-setting="coords"><span></span>Show coordinates</label>
    <label class="toggle"><input type="checkbox" data-setting="badges"><span></span>Show probability badges</label>
    <label class="toggle"><input type="checkbox" data-setting="hints"><span></span>Highlight legal moves</label>
    <label class="toggle"><input type="checkbox" data-setting="anim"><span></span>Animations (glow, measurement flash)</label>
    <label class="toggle"><input type="checkbox" data-setting="flip"><span></span>Flip board (Black at the bottom)</label>
  </section>

  <section class="set-group">
    <h3>Quantum engine</h3>
    <label class="radio"><input type="radio" name="engine" value="auto"><span></span><b>Automatic</b> · Qiskit when the server is running, otherwise in-browser</label>
    <label class="radio"><input type="radio" name="engine" value="qiskit"><span></span><b>Qiskit server</b> · real Qiskit Statevector (run <code>uvicorn src.api:app</code>)</label>
    <label class="radio"><input type="radio" name="engine" value="local"><span></span><b>In-browser</b> · JavaScript port, verified against Qiskit, works offline</label>
    <p class="set-note" id="engineNote"></p>
  </section>

  <div class="sheet-foot">
    <button class="secondary" id="resetSettings">Reset to defaults</button>
    <form method="dialog"><button class="primary">Done</button></form>
  </div>
</dialog>

<div id="toast" class="toast hidden"></div>

<script src="engine.js"></script>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
