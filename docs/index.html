      }
      return out;
    }

    clearTargets(kind, sq) {
      return rays(kind, sq)
        .filter(([t, path]) => !this.pieces.has(t) && !path.some((p) => this.pieces.has(p)))
        .map(([t]) => t);
    }

    pawnOptions(sq, piece, out) {
      const step = piece.color === WHITE ? 1 : -1, f = fileOf(sq), r = rankOf(sq) + step;
      if (onBoard(f, r)) {
        const fwd = square(f, r);
        if (!this.pieces.has(fwd) || this.q.isActive(fwd)) out.move.push(fwd);
      }
      for (const df of [-1, 1]) {
        if (onBoard(f + df, r)) {
          const d = square(f + df, r), occ = this.pieces.get(d);
          if (occ && occ.color !== piece.color) out.capture.push(d);
        }
      }
    }

    hasAnyMove() {
      for (const [sq, p] of this.pieces) {
        if (p.color !== this.turn) continue;
        const o = this.options(sq);
        if (o.move.length || o.capture.length || o.split.length || o.merge.size) return true;
      }
      return false;
    }

    // ---------------- actions
    move(src, dst) {
      const piece = this.mover(src), o = this.options(src);
      if (o.capture.includes(dst)) return this.finish("capture", piece, src, dst, this.capture(piece, src, dst));
      if (!o.move.includes(dst)) throw new IllegalMove(`${piece.kind} on ${name(src)} cannot move to ${name(dst)}`);
      const ok = piece.kind === PAWN ? this.pawnPush(piece, src, dst) : this.slide(piece, src, dst);
      return this.finish("move", piece, src, dst, ok);
    }

    split(src, t1, t2) {
      const piece = this.mover(src), o = this.options(src);
      if (t1 === t2 || !o.split.includes(t1) || !o.split.includes(t2))
        throw new IllegalMove(`cannot split ${name(src)} to ${name(t1)} and ${name(t2)}`);
      this.makeRoom(3);
      if (this.pieces.get(src) !== piece) {
        this.event(`${name(src)} collapsed away before the split`);
        return this.finish("split", piece, src, t1, false);
      }
      this.q.activate(src, true); this.q.activate(t1, false); this.q.activate(t2, false);
      this.q.apply("√iSWAP", [], src, t1);
      this.q.apply("iSWAP", [], src, t2);
      this.pieces.set(t1, piece); this.pieces.set(t2, piece);
      this.settle();
      return this.finish("split", piece, src, t1, true, t2);
    }

    merge(s1, s2, dst) {
      const piece = this.mover(s1), ts = this.options(s1).merge.get(s2) || [];
      if (!ts.includes(dst)) throw new IllegalMove(`cannot merge ${name(s1)} and ${name(s2)} on ${name(dst)}`);
      this.makeRoom(1);
      if (this.pieces.get(s1) !== piece || this.pieces.get(s2) !== piece) {
        this.event("one half collapsed away before the merge");
        return this.finish("merge", piece, s1, dst, false);
      }
      this.q.activate(dst, false);
      this.q.apply("iSWAP†", [], dst, s2);
      this.q.apply("√iSWAP†", [], dst, s1);
      this.pieces.set(dst, piece);
      this.settle();
      return this.finish("merge", piece, s1, dst, true, s2);
    }

    // ---------------- internals
    mover(src) {
      if (this.winner) throw new IllegalMove("the game is over");
      const piece = this.pieces.get(src);
      if (!piece || piece.color !== this.turn) throw new IllegalMove(`no ${this.turn} piece on ${name(src)}`);
      return piece;
    }
    event(t) { this.events.push(t); }

    measureSq(sq) {
      const result = this.q.measure(sq), piece = this.pieces.get(sq);
      this.event(`measured ${name(sq)}: ${piece.kind} ${result ? "present" : "absent"}`);
      this.settle();
      return result;
    }

    settle() {
      for (const [sq, v] of this.q.compact()) if (v === 0) this.pieces.delete(sq);
    }

    makeRoom(needed) {
      while (this.q.numQubits + needed > MAX_QUBITS && this.q.numQubits) {
        const sq = this.q.active[0];
        this.event(`qubit budget reached: forced measurement of ${name(sq)}`);
        this.measureSq(sq);
      }
    }

    moveClassically(piece, src, dst) {
      this.pieces.delete(src);
      this.pieces.set(dst, piece);
      if (piece.kind === PAWN && (rankOf(dst) === 0 || rankOf(dst) === 4)) {
        this.pieces.set(dst, { pid: piece.pid, color: piece.color, kind: QUEEN });
        this.event(`pawn promoted to queen on ${name(dst)}`);
      }
    }

    slide(piece, src, dst) {
      const path = pathBetween(piece.kind, src, dst) || [];
      let controls = path.filter((p) => this.pieces.has(p));
      if (this.definite(src) && !controls.length) { this.moveClassically(piece, src, dst); return true; }
      this.makeRoom(2);
      if (this.pieces.get(src) !== piece) { this.event(`${name(src)} collapsed away before the move`); return false; }
      controls = path.filter((p) => this.pieces.has(p));
      if (controls.some((p) => this.definite(p))) { this.event("path became blocked"); return false; }
      this.q.activate(src, true); this.q.activate(dst, false);
      this.q.apply("iSWAP", controls, src, dst);
      this.pieces.set(dst, piece);
      if (controls.length) this.event(`${piece.kind} entangled with the piece(s) on ${controls.map(name).join(", ")}`);
      this.settle();
      return true;
    }

    pawnPush(piece, src, dst) {
      if (this.pieces.has(dst) && this.measureSq(dst)) { this.event(`pawn blocked on ${name(dst)}`); return false; }
      this.moveClassically(piece, src, dst);
      return true;
    }

    capture(piece, src, dst) {
      if (this.q.isActive(src) && !this.measureSq(src)) { this.event("the attacker was not really there"); return false; }
      const path = [KNIGHT, KING, PAWN].includes(piece.kind) ? [] : (pathBetween(piece.kind, src, dst) || []);
      for (const p of path) {
        if (this.pieces.has(p) && (this.definite(p) || this.measureSq(p))) {
          this.event(`capture blocked by the piece on ${name(p)}`);
          return false;
        }
      }
      if (this.pieces.has(dst) && this.q.isActive(dst)) this.measureSq(dst);
      const victim = this.pieces.get(dst);
      if (!victim) {
        if (piece.kind === PAWN) { this.event("the target was not there; the pawn stays"); return false; }
        this.event(`${name(dst)} was empty; the ${piece.kind} moves in`);
      } else {
        this.pieces.delete(dst);
        this.event(`captured ${victim.color}${victim.kind} on ${name(dst)}`);
        if (victim.kind === KING) this.winner = piece.color;
      }
      this.moveClassically(piece, src, dst);
      return true;
    }

    finish(kind, piece, src, dst, ok, extra = null) {
      this.lastTrace = this.q.takeTrace();
      const entry = {
        ply: this.ply, color: piece.color, piece: piece.kind, kind,
        from: name(src), to: name(dst), extra: extra === null ? null : name(extra), ok, events: this.events,
      };
      this.events = [];
      this.log.push(entry);
      this.ply += 1;
      if (!this.winner) {
        this.turn = other(this.turn);
        if (!this.hasAnyMove()) this.winner = "draw";
      }
      return entry;
    }

    // same JSON shape as the FastAPI /api/{gid} snapshot
    snapshot(id = "local") {
      const squares = [];
      for (let sq = 0; sq < 25; sq++) {
        const p = this.pieces.get(sq);
        squares.push({
          sq: name(sq), piece: p ? { pid: p.pid, color: p.color, kind: p.kind } : null,
          prob: Math.round(this.prob(sq) * 1e4) / 1e4, quantum: this.q.isActive(sq),
        });
      }
      return {
        id, turn: this.turn, winner: this.winner, quantum: this.quantum, ply: this.ply,
        qubits: this.q.numQubits, squares, log: this.log, has_circuit: this.lastTrace.length > 0,
        trace: this.lastTrace.map((t) => ({ ...t, sq: t.sq === undefined ? undefined : name(t.sq),
          squares: t.squares && t.squares.map(name), controls: t.controls && t.controls.map(name) })),
      };
    }
  }

  const QC = { Game, IllegalMove, QuantumState, name, parse, rays, square, WHITE, BLACK, MAX_QUBITS };
  if (typeof module !== "undefined" && module.exports) module.exports = QC;
  else root.QC = QC;
})(this);

</script>
<script>
// Content pages: the illustrated manual and the "Classical vs Quantum" blog post.
// Uses buildBoard / barChart / lineChart from app.js and the QC engine from engine.js.
"use strict";

// ------------------------------------------------------------------ figures
/**
 * A rule diagram: a small board rendered with the real board styles.
 * pieces: { a3: "wN" } or { a3: ["wN", 0.5] };  marks: { c3: "dot" };  arrows: [["b1","a3"], ...]
 */
function figure({ pieces = {}, marks = {}, arrows = [], last = [], sel = null, caption = "", n = "" }) {
  const cells = {};
  for (const [sq, spec] of Object.entries(pieces)) {
    if (!spec) continue;                       // lets a figure remove a piece: { b1: undefined }
    const [sym, prob] = Array.isArray(spec) ? spec : [spec, 1];
    cells[sq] = { color: sym[0], kind: sym[1], prob };
  }
  const fig = document.createElement("figure");
  fig.className = "fig";
  const wrap = document.createElement("div");
  wrap.className = "fig-board";
  wrap.appendChild(buildBoard(cells, { marks, last, sel, mini: true, coords: true, badges: true }));
  if (arrows.length) {
    const c = (sq) => [("abcde".indexOf(sq[0]) + 0.5) * 20, (5 - Number(sq[1]) + 0.5) * 20];
    let svg = `<svg class="fig-arrows" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><marker id="ah" markerWidth="4" markerHeight="4" refX="2.2" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="rgba(255,170,0,0.95)"/></marker></defs>`;
    for (const [a, b] of arrows) {
      const [x1, y1] = c(a), [x2, y2] = c(b);
      const k = 7 / Math.hypot(x2 - x1, y2 - y1);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2 - (x2 - x1) * k}" y2="${y2 - (y2 - y1) * k}" stroke="rgba(255,170,0,0.9)" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/>`;
    }
    wrap.insertAdjacentHTML("beforeend", svg + "</svg>");
  }
  fig.appendChild(wrap);
  fig.insertAdjacentHTML("beforeend", `<figcaption><b>${n}</b> ${caption}</figcaption>`);
  return fig;
}

function figRow(...figs) {
  const row = document.createElement("div");
  row.className = "fig-row";
  figs.forEach((f) => row.appendChild(f));
  return row;
}

function section(parent, html) {
  const s = document.createElement("section");
  s.innerHTML = html;
  parent.appendChild(s);
  return s;
}

const START = {
  a5: "bR", b5: "bN", c5: "bB", d5: "bQ", e5: "bK", a4: "bP", b4: "bP", c4: "bP", d4: "bP", e4: "bP",
  a2: "wP", b2: "wP", c2: "wP", d2: "wP", e2: "wP", a1: "wR", b1: "wN", c1: "wB", d1: "wQ", e1: "wK",
};
const img = (s) => `<img class="inline-piece" src="${pieceUrl(s[0], s[1])}" alt="">`;

// ------------------------------------------------------------------ manual
function buildManual(root) {
  root.innerHTML = `
    <p class="eyebrow">Instruction manual</p>
    <h1>How to play Quantum Chess 5×5</h1>
    <p class="lede">Chess on Martin Gardner's 5×5 board, where pieces can be in two places at once.
    Every square is a qubit, every quantum move is a gate, and every capture is a measurement.</p>
    <nav class="toc">
      <a href="#m-goal">1 · Goal & board</a><a href="#m-pieces">2 · Pieces</a><a href="#m-turn">3 · Your turn</a>
      <a href="#m-split">4 · Split</a><a href="#m-merge">5 · Merge</a><a href="#m-entangle">6 · Entanglement</a>
      <a href="#m-capture">7 · Captures</a><a href="#m-pawns">8 · Pawns</a><a href="#m-end">9 · Winning</a>
      <a href="#m-controls">10 · Controls</a><a href="#m-fair">11 · Engines & fair play</a>
    </nav>`;
  root.querySelectorAll(".toc a").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault();
    document.querySelector(a.getAttribute("href")).scrollIntoView({ behavior: "smooth" });
  }));

  let s = section(root, `
    <h2 id="m-goal">1 · Goal and board</h2>
    <p><b>Capture the enemy king.</b> There is no check or checkmate: a king that might be in two places
    can't be "in check" in any meaningful way, so you simply have to take it, and a capture of a "maybe" king
    only succeeds if a measurement finds it there.</p>
    <p>The board is Gardner's Minichess (1969): 5×5 squares, each side with a king, queen, rook, bishop,
    knight and five pawns. White moves first.</p>`);
  s.appendChild(figure({ pieces: START, n: "Figure 1.", caption: "Starting position. White plays up the board." }));

  section(root, `
    <h2 id="m-pieces">2 · The pieces</h2>
    <table class="rules-table">
      <tr><th>Piece</th><th>Moves like</th><th>Quantum abilities</th></tr>
      <tr><td>${img("wK")} King</td><td>One square in any direction</td><td>Split, merge. Must be found by a measurement to be captured.</td></tr>
      <tr><td>${img("wQ")} Queen</td><td>Any distance, straight or diagonal</td><td>Split, merge, entangling slides</td></tr>
      <tr><td>${img("wR")} Rook</td><td>Any distance, straight</td><td>Split, merge, entangling slides</td></tr>
      <tr><td>${img("wB")} Bishop</td><td>Any distance, diagonal</td><td>Split, merge, entangling slides</td></tr>
      <tr><td>${img("wN")} Knight</td><td>L-shape, jumps over pieces</td><td>Split, merge (jumps never entangle)</td></tr>
      <tr><td>${img("wP")} Pawn</td><td>One step forward; captures one step diagonally</td><td>None: pawns are always classical</td></tr>
    </table>
    <p>A piece shown <b>translucent with a purple glow and a % badge</b> is in superposition: the badge is the
    probability that it is really on that square. The two halves of a split piece always add up to 100%.</p>`);

  s = section(root, `
    <h2 id="m-turn">3 · Your turn: one action</h2>
    <p>Each turn you do exactly one of these. Choose the type with the <b>Move / Split / Merge</b> buttons
    (or keys <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>).</p>
    <ul class="ticks">
      <li><b>Move</b>: an ordinary chess move. Grey dots show quiet moves, grey rings show captures.</li>
      <li><b>Split</b>: put a piece on two empty squares at once.</li>
      <li><b>Merge</b>: bring the two halves of a split piece together on one square.</li>
      <li><b>Capture</b>: move onto an enemy piece. If anything involved is uncertain, the board is measured first.</li>
    </ul>
    <p>A move that fails (for example a capture whose attacker turned out not to be there) still uses your turn.</p>`);
  s.appendChild(figure({ pieces: { ...START, b1: undefined, c3: "wN" }, marks: { b1: "dot", a4: "ring", b5: "ring", d5: "ring", e4: "ring" }, sel: "c3",
    n: "Figure 2.", caption: "Knight on c3 selected: dots are empty squares, rings are captures." }));

  s = section(root, `
    <h2 id="m-split">4 · Split: superposition</h2>
    <p>Choose <b>Split</b>, click a non-pawn piece, then click <b>two empty squares</b> it could reach
    (purple dots). The piece now stands on both squares with 50% probability each.</p>
    <p class="qbox"><b>Under the hood:</b> the piece's qubit is |1⟩. A <code>√iSWAP</code> with the first target
    sends half the amplitude there; an <code>iSWAP</code> with the second target sends the rest.
    The state is <code>i(|a3⟩ + |c3⟩)/√2</code>.</p>`);
  s.appendChild(figRow(
    figure({ pieces: START, marks: { a3: "qdot", c3: "qdot" }, arrows: [["b1", "a3"], ["b1", "c3"]], n: "Figure 3a.", caption: "Split the b1 knight towards a3 and c3." }),
    figure({ pieces: { ...START, b1: undefined, a3: ["wN", 0.5], c3: ["wN", 0.5] }, last: ["b1", "a3", "c3"], n: "Figure 3b.", caption: "Result: the knight is 50% on a3 and 50% on c3." }),
  ));

  s = section(root, `
    <h2 id="m-merge">5 · Merge: interference</h2>
    <p>Choose <b>Merge</b>, click one half of a split piece, click its other half (outlined), then click an
    empty square both halves can reach. The halves recombine there.</p>
    <p>If the two halves still have the phases a split gave them, the merge is <b>certain (100%)</b>: the
    amplitudes add up on the target and cancel elsewhere. If one half has moved on its own since, the phases
    differ and the merge may leave some probability behind. That is real quantum interference, and you can
    use it.</p>
    <p class="qbox"><b>Under the hood:</b> the split run backwards, <code>iSWAP†</code> then <code>√iSWAP†</code>.</p>`);
  s.appendChild(figRow(
    figure({ pieces: { ...START, b1: undefined, a3: ["wN", 0.5], c3: ["wN", 0.5] }, marks: { a3: "partner", c3: "partner", b1: "qdot" }, arrows: [["a3", "b1"], ["c3", "b1"]], n: "Figure 4a.", caption: "Merge both halves back onto b1." }),
    figure({ pieces: START, last: ["b1"], n: "Figure 4b.", caption: "Result: the knight is back on b1 with 100% certainty." }),
  ));

  s = section(root, `
    <h2 id="m-entangle">6 · Sliding past a "maybe" piece: entanglement</h2>
    <p>Rooks, bishops and queens may slide <b>through</b> a square that holds a piece in superposition. The
    move happens only in the branch where that square is empty, so your piece becomes <b>entangled</b> with it:
    if one is later measured, the other is decided too.</p>
    <p class="qbox"><b>Under the hood:</b> an <code>iSWAP</code> on (from, to) controlled on the path square being
    |0⟩ (an open control dot). After the move: rook on a4 ⇔ knight not on a2.</p>`);
  s.appendChild(figRow(
    figure({ pieces: { a1: "wR", e1: "wK", a2: ["bN", 0.5], b5: ["bN", 0.5], e5: "bK" }, arrows: [["a1", "a4"]], marks: { a4: "dot" }, n: "Figure 5a.", caption: "Black's knight is 50% on a2. White's rook slides a1 → a4 through it." }),
    figure({ pieces: { a1: ["wR", 0.5], a4: ["wR", 0.5], e1: "wK", a2: ["bN", 0.5], b5: ["bN", 0.5], e5: "bK" }, last: ["a1", "a4"], n: "Figure 5b.", caption: "Entangled: either (knight a2, rook a1) or (knight b5, rook a4)." }),
  ));

  s = section(root, `
    <h2 id="m-capture">7 · Captures are measurements</h2>
    <p>When a capture involves anything uncertain, the engine measures in this order:</p>
    <ol class="steps">
      <li><b>The attacker's square.</b> If your piece isn't really there, the capture fizzles.</li>
      <li><b>Any "maybe" pieces on the path</b> (sliders only). If one is really there, the capture is blocked.</li>
      <li><b>The target square.</b> If the enemy is there, it is captured; if not, your piece just moves onto the empty square.</li>
    </ol>
    <p>Each measurement collapses the state: probabilities snap to 0% or 100% everywhere they are linked.
    Measured squares flash purple and the move list shows each result.</p>`);
  s.appendChild(figRow(
    figure({ pieces: { a1: "wR", e1: "wK", a2: ["bN", 0.5], b5: ["bN", 0.5], e5: "bK" }, marks: { a2: "ring" }, arrows: [["a1", "a2"]], n: "Figure 6a.", caption: "The rook attacks a 50% knight on a2." }),
    figure({ pieces: { a2: "wR", e1: "wK", e5: "bK" }, last: ["a1", "a2"], n: "Figure 6b.", caption: "Outcome 1 (50%): the knight was there and is captured." }),
    figure({ pieces: { a2: "wR", e1: "wK", b5: "bN", e5: "bK" }, last: ["a1", "a2"], n: "Figure 6c.", caption: "Outcome 2 (50%): a2 was empty; the knight is now certainly on b5." }),
  ));

  s = section(root, `
    <h2 id="m-pawns">8 · Pawns</h2>
    <ul class="ticks">
      <li>Pawns move one square forward (no double step) and capture one square diagonally forward.</li>
      <li>Pawns never split or merge.</li>
      <li><b>Measured push:</b> if the square in front holds a "maybe" piece, it is measured. Empty: the pawn moves. Occupied: the pawn is blocked and the turn is used.</li>
      <li>A pawn reaching the last rank becomes a queen.</li>
    </ul>`);
  s.appendChild(figRow(
    figure({ pieces: { ...START, b1: undefined, a3: ["wN", 0.5], c3: ["wN", 0.5] }, arrows: [["c4", "c3"]], marks: { c3: "dot" }, n: "Figure 7a.", caption: "Black pushes c4 into the 50% knight square." }),
    figure({ pieces: { ...START, b1: undefined, c3: "wN" }, last: ["c3"], n: "Figure 7b.", caption: "Measured: the knight was on c3, so the pawn is blocked." }),
  ));

  section(root, `
    <h2 id="m-end">9 · Winning, draws and the qubit budget</h2>
    <ul class="ticks">
      <li><b>Win</b> by capturing the enemy king.</li>
      <li><b>Draw</b> if the side to move has no legal action.</li>
      <li>No check, no castling, no en passant.</li>
      <li><b>Qubit budget:</b> only uncertain squares cost qubits, and at most 16 can be uncertain at once.
      If a move would exceed that, the oldest uncertain square is measured first ("forced measurement").</li>
    </ul>`);

  section(root, `
    <h2 id="m-controls">10 · Controls</h2>
    <table class="rules-table">
      <tr><th>Action</th><th>How</th></tr>
      <tr><td>Move / capture</td><td>Move mode: click a piece, then a dot or ring</td></tr>
      <tr><td>Split</td><td>Split mode (<kbd>2</kbd>): click a piece, then two purple dots</td></tr>
      <tr><td>Merge</td><td>Merge mode (<kbd>3</kbd>): click one half, its outlined partner, then a purple dot</td></tr>
      <tr><td>Cancel a selection</td><td><kbd>Esc</kbd></td></tr>
      <tr><td>Change theme, hints, coordinates, board flip, engine</td><td>⚙ Settings (top right)</td></tr>
      <tr><td>Play without quantum moves</td><td>"Classical baseline" button</td></tr>
    </table>`);

  section(root, `
    <h2 id="m-fair">11 · Engines and fair play</h2>
    <p>The quantum state is a full statevector simulation. The badge at the top right shows which engine computes it:</p>
    <ul class="ticks">
      <li><b>⚛ Qiskit</b>: when the page is served by <code>uvicorn src.api:app</code>, every gate and measurement
      runs in Qiskit (<code>Statevector.evolve</code> and <code>Statevector.measure</code>), and the circuit panel shows Qiskit's own drawing.</li>
      <li><b>◐ In-browser</b>: when the page is opened as a file or offline, a JavaScript port of the same engine
      runs locally. The test <code>tests/test_js_engine.py</code> replays hundreds of moves through both engines and
      checks that every probability matches Qiskit's.</li>
    </ul>`);
}

// ------------------------------------------------------------------ blog
const NOISE = [[0, 1.0], [0.005, 0.847], [0.01, 0.724], [0.02, 0.531], [0.05, 0.245], [0.1, 0.144]];

function buildBlog(root) {
  root.innerHTML = `
    <p class="eyebrow">Blog · Qiskit Fall Fest 2026</p>
    <h1>Same board, different universe: classical vs quantum 5×5 chess</h1>
    <p class="byline">Mohamed Thoufic · 8 min read · experiments run live in your browser</p>

    <p class="lede">Gardner's 5×5 minichess is small enough that computers have solved it. What happens to
    such a tidy game when pieces are allowed to be in two places at once?</p>

    <h2>A small game with a big result</h2>
    <p>Martin Gardner introduced the 5×5 setup in 1969 as a pocket version of chess: one of each major piece
    plus five pawns per side, no castling, no double pawn steps. Because the board is so small, the game is
    within reach of exhaustive search, and in 2013 Mehdi Mhalla and Frédéric Prost showed that with perfect play
    it is a <b>draw</b>. Classical 5×5 chess is a game of complete information: both players see everything, and
    the best move in any position is a fixed fact.</p>

    <h2>Four rules that change everything</h2>
    <p>Quantum 5×5 chess keeps the board and the pieces, and adds four mechanics, each one a real quantum effect:</p>
    <div class="compare-cards">
      <div class="cc"><h3>Superposition</h3><p>A split puts one piece on two squares. Nobody, not even its owner, knows which is "real".</p></div>
      <div class="cc"><h3>Interference</h3><p>A merge recombines the halves with certainty, something no coin-flip game can do.</p></div>
      <div class="cc"><h3>Entanglement</h3><p>Sliding past a "maybe" piece ties two pieces' fates together.</p></div>
      <div class="cc"><h3>Measurement</h3><p>Captures force the board to decide, and the decision is genuinely random.</p></div>
    </div>

    <h2>Side by side</h2>
    <table class="rules-table compare">
      <tr><th></th><th>Classical 5×5</th><th>Quantum 5×5</th></tr>
      <tr><td>State of the board</td><td>One position</td><td>A superposition of positions (a statevector)</td></tr>
      <tr><td>Actions per turn</td><td>Moves and captures</td><td>Moves, captures, splits, merges</td></tr>
      <tr><td>Information</td><td>Complete</td><td>Incomplete for <i>both</i> players until measured</td></tr>
      <tr><td>Chance</td><td>None</td><td>Measurement outcomes follow the Born rule</td></tr>
      <tr><td>Check / checkmate</td><td>Yes</td><td>No: you must actually capture the king</td></tr>
      <tr><td>Solved?</td><td>Yes, a draw (2013)</td><td>No: chance and hidden state make "best play" a probability</td></tr>
    </table>

    <h2>Experiment 1: how much bigger is the game?</h2>
    <p>The simplest measure of a game's complexity is its <b>branching factor</b>, the number of options a player
    has each turn. The button below plays random games with the in-browser engine in both modes and counts.</p>
    <div class="experiment" id="exp1">
      <div class="exp-controls"><button class="primary" id="exp1Run">Run 60 random games per mode</button><span class="muted" id="exp1Status"></span></div>
      <div id="exp1Out"></div>
    </div>

    <h2>Experiment 2: interference vs a coin flip</h2>
    <p>Split a knight, then merge it straight back. A quantum split followed by a merge returns the knight
    every time. Replace the split with a fair coin flip ("the knight is on a3 or c3, I just don't know which")
    and run the very same merge gates: it only comes back half the time. The difference is
    <b>phase</b>, and it is the clearest proof that these moves are not dice in disguise.</p>
    <div class="experiment" id="exp2">
      <div class="exp-controls"><button class="primary" id="exp2Run">Run 1000 split + merge trials</button><span class="muted" id="exp2Status"></span></div>
      <div id="exp2Out"></div>
    </div>

    <h2>How the strategy changes</h2>
    <ul class="ticks">
      <li><b>Hedging your king.</b> A split king is harder to capture: an attack only succeeds if the measurement finds it.</li>
      <li><b>Every capture is a gamble with information.</b> Even a failed capture collapses the state, telling both players where pieces really are.</li>
      <li><b>Tempo has a price.</b> A capture that fizzles still uses your turn, so attacking uncertain pieces is a real risk.</li>
      <li><b>Bluffing becomes legal.</b> A 50% queen controls twice the squares, and your opponent must decide whether to test it.</li>
    </ul>

    <h2>Reality check: this needs a perfect quantum computer</h2>
    <p>Every quantum move here is simulated exactly. On today's noisy (NISQ) hardware each iSWAP compiles to
    several CNOT gates, and errors leak probability onto squares where no piece should be. The chart shows the
    split-then-merge round trip from Experiment 2 run on Qiskit Aer with a depolarizing noise model
    (notebook section 7): already at 1% gate error, the "certain" merge only succeeds 72% of the time.</p>
    <div class="experiment">${lineChart(NOISE, { xLabel: "1-qubit gate error rate (2-qubit error = 2×)", yLabel: "P(knight back on b1)" })}
      <p class="muted small">P(knight back on b1) after split + merge, 4000 shots per point, transpiled to 8 CNOTs.</p></div>
    <p>Long games would also outlast qubit coherence times, and exact simulation doubles in cost with every
    extra uncertain square, which is why the engine caps the game at 16 uncertain squares.</p>

    <h2>Verdict</h2>
    <p>Classical 5×5 chess is a solved puzzle. The quantum version turns it back into a game: more options per
    turn, hidden information that neither player controls, and outcomes decided by measurement. Its quantum
    features are not decoration: interference makes merges work, entanglement links pieces, and measurement
    decides captures, all computed with Qiskit statevectors.</p>

    <h3>References</h3>
    <ol class="refs">
      <li>M. Mhalla, F. Prost, "Gardner's Minichess Variant is Solved", <i>ICGA Journal</i> 36(4), 2013.</li>
      <li>M. Gardner, Mathematical Games column, <i>Scientific American</i>, 1969.</li>
      <li>C. Cantwell, "Quantum Chess: Developing a Mathematical Framework and Design Methodology for Creating Quantum Games", arXiv:1906.05836, 2019.</li>
      <li>Qiskit, <i>quantum_info.Statevector</i> and Qiskit Aer noise models.</li>
    </ol>`;

  $("exp1Out").innerHTML = exp1Chart({ classical: 13.5, quantum: 21.1 }, null, true);
  $("exp1Run").addEventListener("click", runExperiment1);
  $("exp2Run").addEventListener("click", runExperiment2);
}

function exp1Chart(branch, extra, fromNotebook = false) {
  let html = barChart([
    { label: "Classical 5×5", value: branch.classical, text: branch.classical.toFixed(1), color: "#8d8d8d" },
    { label: "Quantum 5×5", value: branch.quantum, text: branch.quantum.toFixed(1), color: "#0f62fe" },
  ]);
  html += `<p class="muted small">${fromNotebook ? "Average actions per turn from the Qiskit notebook (40 games per mode). Press the button to rerun it here." : "Average actions per turn (every move, capture, split pair and merge counts as one action)."}</p>`;
  if (extra) {
    html += `<table class="rules-table compact"><tr><th></th><th>Classical</th><th>Quantum</th></tr>
      <tr><td>Average game length (plies)</td><td>${extra.len.classical.toFixed(1)}</td><td>${extra.len.quantum.toFixed(1)}</td></tr>
      <tr><td>Games ending with a king capture</td><td>${extra.decisive.classical}%</td><td>${extra.decisive.quantum}%</td></tr>
      <tr><td>Measurements per game</td><td>0</td><td>${extra.meas.toFixed(1)}</td></tr></table>`;
  }
  return html;
}

function randomGame(quantum, seed, maxPlies = 80) {
  const g = new QC.Game({ seed, quantum });
  let rnd = seed * 9301 + 49297;
  const rand = (n) => { rnd = (rnd * 9301 + 49297) % 233280; return Math.floor((rnd / 233280) * n); };
  const counts = [];
  let meas = 0;
  for (let i = 0; i < maxPlies && !g.winner; i++) {
    const acts = [];
    for (const [sq, p] of g.pieces) {
      if (p.color !== g.turn) continue;
      const o = g.options(sq);
      for (const t of o.move.concat(o.capture)) acts.push(["move", sq, t]);
      for (let a = 0; a < o.split.length; a++) for (let b = a + 1; b < o.split.length; b++) acts.push(["split", sq, o.split[a], o.split[b]]);
      for (const [s2, ts] of o.merge) for (const t of ts) acts.push(["merge", sq, s2, t]);
    }
    counts.push(acts.length);
    const a = acts[rand(acts.length)];
    const e = g[a[0]](a[1], a[2], a[3]);
    meas += e.events.filter((ev) => ev.startsWith("measured")).length;
  }
  return { branch: counts.reduce((x, y) => x + y, 0) / counts.length, len: g.ply, decisive: g.winner === "w" || g.winner === "b", meas };
}

function runExperiment1() {
  const N = 60, out = { classical: [], quantum: [] };
  const btn = $("exp1Run");
  btn.disabled = true;
  let i = 0;
  const step = () => {
    const end = Math.min(i + 6, 2 * N);
    for (; i < end; i++) out[i < N ? "classical" : "quantum"].push(randomGame(i >= N, 1000 + (i % N)));
    $("exp1Status").textContent = `${i} / ${2 * N} games`;
    if (i < 2 * N) return setTimeout(step, 0);
    const avg = (arr, k) => arr.reduce((s, r) => s + Number(r[k]), 0) / arr.length;
    $("exp1Out").innerHTML = exp1Chart(
      { classical: avg(out.classical, "branch"), quantum: avg(out.quantum, "branch") },
      {
        len: { classical: avg(out.classical, "len"), quantum: avg(out.quantum, "len") },
        decisive: { classical: Math.round(100 * avg(out.classical, "decisive")), quantum: Math.round(100 * avg(out.quantum, "decisive")) },
        meas: avg(out.quantum, "meas"),
      });
    $("exp1Status").textContent = "Done (random players, so these measure the rules, not good play).";
    btn.disabled = false;
  };
  step();
}

function runExperiment2() {
  const T = 1000, b1 = QC.parse("b1"), a3 = QC.parse("a3"), c3 = QC.parse("c3");
  let quantumBack = 0, classicalBack = 0;
  for (let t = 0; t < T; t++) {
    // quantum: split then merge, then look
    const q = new QC.QuantumState(t);
    q.activate(b1, true); q.activate(a3, false); q.activate(c3, false);
    q.apply("√iSWAP", [], b1, a3); q.apply("iSWAP", [], b1, c3);
    q.apply("iSWAP†", [], b1, c3); q.apply("√iSWAP†", [], b1, a3);
    quantumBack += q.measure(b1);
    // classical: a coin decides a3 or c3, then the same merge gates
    const c = new QC.QuantumState(T + t);
    const heads = c.rng() < 0.5;
    c.activate(b1, false); c.activate(a3, heads); c.activate(c3, !heads);
    c.apply("iSWAP†", [], b1, c3); c.apply("√iSWAP†", [], b1, a3);
    classicalBack += c.measure(b1);
  }
  $("exp2Out").innerHTML = barChart([
    { label: "Quantum split → merge", value: quantumBack, text: `${quantumBack} / ${T}`, color: "#a970ff" },
    { label: "Coin flip → same merge", value: classicalBack, text: `${classicalBack} / ${T}`, color: "#8d8d8d" },
  ], { max: T }) + `<p class="muted small">Knight found back on b1, out of ${T} trials each.</p>`;
  $("exp2Status").textContent = "Done.";
}

</script>
<script>
// Quantum Chess 5x5: single-page app (Play, How to play, Classical vs Quantum, Settings).
// The quantum state is computed by the Qiskit server when it is running, otherwise
// by the in-browser port in engine.js (window.QC).
"use strict";

const FILES = "abcde";
const GLYPH = { K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙" };
const $ = (id) => document.getElementById(id);

// ================================================================== settings
const THEMES = [
  { id: "blue", label: "Ocean blue", light: "#e8edf4", dark: "#7d9ac0" },
  { id: "pink", label: "Rose pink", light: "#fbeef2", dark: "#db8fa8" },
  { id: "lavender", label: "Quantum lavender", light: "#f1ecfb", dark: "#9b86c9" },
  { id: "green", label: "Classic green", light: "#ebecd0", dark: "#779556" },
];
const DEFAULTS = { theme: "blue", coords: true, badges: true, hints: true, anim: true, flip: false, engine: "auto" };
let settings = { ...DEFAULTS };

function loadSettings() {
  try { settings = { ...DEFAULTS, ...JSON.parse(localStorage.getItem("qc-settings") || "{}") }; } catch (e) { /* storage unavailable */ }
}
function saveSettings() {
  try { localStorage.setItem("qc-settings", JSON.stringify(settings)); } catch (e) { /* storage unavailable */ }
}
function applySettings() {
  document.body.dataset.theme = settings.theme;
  document.body.classList.toggle("no-anim", !settings.anim);
  document.querySelectorAll("[data-setting]").forEach((el) => (el.checked = !!settings[el.dataset.setting]));
  document.querySelectorAll("input[name=engine]").forEach((el) => (el.checked = el.value === settings.engine));
  document.querySelectorAll(".theme-card").forEach((el) => el.classList.toggle("active", el.dataset.theme === settings.theme));
  $("nameTop").textContent = settings.flip ? "White" : "Black";
  $("nameBottom").textContent = settings.flip ? "Black" : "White";
  document.querySelector("#barTop .avatar").className = "avatar " + (settings.flip ? "white" : "black");
  document.querySelector("#barBottom .avatar").className = "avatar " + (settings.flip ? "black" : "white");
  if (S.state) render();
}

// ================================================================== engines
class LocalEngine {
  constructor() { this.kind = "local"; this.label = "In-browser engine"; }
  async newGame(quantum) { this.g = new QC.Game({ quantum }); return this.g.snapshot(); }
  async options(sq) {
    const o = this.g.options(QC.parse(sq));
    return {
      move: o.move.map(QC.name), capture: o.capture.map(QC.name), split: o.split.map(QC.name),
      merge: Object.fromEntries([...o.merge].map(([k, v]) => [QC.name(k), v.map(QC.name)])),
    };
  }
  async play(kind, src, dst, extra) {
    const [a, b] = [QC.parse(src), QC.parse(dst)];
    if (kind === "move") this.g.move(a, b);
    else if (kind === "split") this.g.split(a, b, QC.parse(extra));
    else this.g.merge(a, QC.parse(extra), b);
    return this.g.snapshot();
  }
  circuit(state) { return state.trace && state.trace.length ? circuitSVG(state.trace) : null; }
}

class ServerEngine {
  constructor(version) { this.kind = "qiskit"; this.label = `Qiskit ${version}`; }
  async call(path, body) {
    const res = await fetch(path, body === undefined ? {} : {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || res.statusText);
    return data;
  }
  async newGame(quantum) { const s = await this.call("api/new", { quantum }); this.gid = s.id; return s; }
  async options(sq) { return this.call(`api/${this.gid}/options/${sq}`); }
  async play(kind, src, dst, extra) { return this.call(`api/${this.gid}/play`, { kind, src, dst, extra }); }
  circuit(state) {
    if (!state.has_circuit) return null;
    const img = new Image();
    img.alt = "Qiskit circuit of the last move";
    img.src = `api/${this.gid}/circuit.svg?ply=${state.ply}`;
    return img;
  }
}

async function probeServer() {
  if (location.protocol === "file:") return null;
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 1500);
    const res = await fetch("api/info", { signal: ctl.signal });
    clearTimeout(timer);
    if (!res.ok) return null;
    const info = await res.json();
    return info.engine === "qiskit" ? info.qiskit : null;
  } catch (e) { return null; }
}

let qiskitVersion = null;
async function chooseEngine() {
  qiskitVersion = await probeServer();
  const wantQiskit = settings.engine === "qiskit" || (settings.engine === "auto" && qiskitVersion);
  if (wantQiskit && qiskitVersion) S.engine = new ServerEngine(qiskitVersion);
  else {
    S.engine = new LocalEngine();
    if (settings.engine === "qiskit") toast("Qiskit server not found, so the in-browser engine is used. Start it with: uvicorn src.api:app");
  }
  const pill = $("enginePill");
  pill.textContent = S.engine.kind === "qiskit" ? `⚛ ${S.engine.label}` : "◐ In-browser engine";
  pill.classList.toggle("qiskit", S.engine.kind === "qiskit");
  $("circuitTitle").textContent = S.engine.kind === "qiskit" ? "Qiskit circuit · last move" : "Circuit · last move (in-browser)";
  $("engineNote").textContent = qiskitVersion
    ? `Qiskit server detected (Qiskit ${qiskitVersion}). Now using: ${S.engine.label}.`
    : "No Qiskit server detected: the in-browser engine is used. It is a line-for-line port of the Qiskit engine, checked against it by tests/test_js_engine.py.";
}

// ================================================================== game state
const S = { engine: null, state: null, mode: "move", sel: null, opts: null, picks: [], partner: null, busy: false };

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.add("hidden"), 3400);
}

async function newGame(quantum) {
  try {
    S.state = await S.engine.newGame(quantum);
  } catch (e) {
    toast("Engine error: " + e.message);
    return;
  }
  clearSelection();
  setMode("move");
  $("circuit").innerHTML = `<span class="muted">Quantum moves show their circuit here.</span>`;
  render();
}

function clearSelection() { S.sel = null; S.opts = null; S.picks = []; S.partner = null; }

function setMode(mode) {
  if (mode !== "move" && S.state && !S.state.quantum) { toast("Classical baseline: split and merge are switched off."); return; }
  S.mode = mode;
  clearSelection();
  document.querySelectorAll(".mode").forEach((b) => b.classList.toggle("active", b.dataset.mode === mode));
  render();
}

const squareInfo = (sq) => S.state.squares.find((s) => s.sq === sq);

async function select(sq) {
  const info = squareInfo(sq);
  if (!info.piece || info.piece.color !== S.state.turn) { clearSelection(); render(); return; }
  S.sel = sq; S.picks = []; S.partner = null;
  S.opts = await S.engine.options(sq);
  if (S.mode === "split" && S.opts.split.length < 2) toast("This piece has no two empty squares to split onto.");
  if (S.mode === "merge" && Object.keys(S.opts.merge).length === 0) toast("Merge needs a piece that is split across two squares.");
  render();
}

async function play(kind, src, dst, extra = null) {
  S.busy = true;
  try {
    S.state = await S.engine.play(kind, src, dst, extra);
  } catch (e) {
    toast(e.message);
    S.busy = false;
    return;
  }
  clearSelection();
  S.busy = false;
  render();
  const last = S.state.log[S.state.log.length - 1];
  flashMeasured(last);
  if (last && last.events.length) toast(last.events[last.events.length - 1]);
  showCircuit();
}

async function onSquare(sq) {
  if (S.busy || !S.state || S.state.winner) return;
  const o = S.opts;
  if (S.mode === "move") {
    if (S.sel && o && (o.move.includes(sq) || o.capture.includes(sq))) return play("move", S.sel, sq);
    return select(sq);
  }
  if (S.mode === "split") {
    if (S.sel && o && o.split.includes(sq) && !S.picks.includes(sq)) {
      S.picks.push(sq);
      if (S.picks.length === 2) return play("split", S.sel, S.picks[0], S.picks[1]);
      return render();
    }
    return select(sq);
  }
  if (S.sel && o && !S.partner && o.merge[sq]) { S.partner = sq; return render(); }
  if (S.sel && S.partner && o.merge[S.partner].includes(sq)) return play("merge", S.sel, sq, S.partner);
  return select(sq);
}

// ================================================================== board rendering (shared)
// the one-file build (tools/build_single_page.py) inlines the images as window.PIECE_DATA
const pieceUrl = (color, kind) => (window.PIECE_DATA ? window.PIECE_DATA[color + kind] : `pieces/${color}${kind}.svg`);

/** Build a 5x5 board element. `cells` maps square -> {color, kind, prob}; `marks` maps square -> css class. */
function buildBoard(cells, { marks = {}, last = [], sel = null, coords = true, flip = false, badges = true, onClick = null, mini = false } = {}) {
  const board = document.createElement("div");
  board.className = "board" + (mini ? " mini" : "");
  const ranks = flip ? [0, 1, 2, 3, 4] : [4, 3, 2, 1, 0];
  const files = flip ? [4, 3, 2, 1, 0] : [0, 1, 2, 3, 4];
  for (const r of ranks) {
    for (const f of files) {
      const sq = FILES[f] + (r + 1);
      const el = document.createElement("div");
      el.className = "sq " + ((f + r) % 2 === 0 ? "dark" : "light");
      el.dataset.sq = sq;
      if (last.includes(sq)) el.classList.add("last");
      if (sel === sq) el.classList.add("sel");
      if (coords && f === files[0]) el.insertAdjacentHTML("beforeend", `<span class="coord rank">${r + 1}</span>`);
      if (coords && r === ranks[4]) el.insertAdjacentHTML("beforeend", `<span class="coord file">${FILES[f]}</span>`);
      const c = cells[sq];
      if (c) {
        const p = document.createElement("div");
        p.className = "piece";
        p.style.backgroundImage = `url(${pieceUrl(c.color, c.kind)})`;
        if (c.prob < 0.9999) {
          p.classList.add("maybe");
          p.style.opacity = (0.3 + 0.7 * c.prob).toFixed(2);
          if (badges) el.insertAdjacentHTML("beforeend", `<span class="badge">${Math.round(c.prob * 100)}%</span>`);
        }
        el.appendChild(p);
      }
      if (marks[sq]) el.insertAdjacentHTML("beforeend", `<span class="${marks[sq]}"></span>`);
      if (onClick) el.addEventListener("click", () => onClick(sq));
      board.appendChild(el);
    }
  }
  return board;
}

function render() {
  if (!S.state) return;
  const cells = {};
  for (const s of S.state.squares) if (s.piece) cells[s.sq] = { ...s.piece, prob: s.prob };
  const last = S.state.log[S.state.log.length - 1];
  const board = buildBoard(cells, {
    marks: settings.hints ? hintMap() : {}, sel: S.sel, coords: settings.coords, flip: settings.flip,
    badges: settings.badges, last: last ? [last.from, last.to, last.extra].filter(Boolean) : [], onClick: onSquare,
  });
  board.id = "board";
  $("board").replaceWith(board);
  renderPanel();
}

function hintMap() {
  const m = {}, o = S.opts;
  if (!S.sel || !o) return m;
  if (S.mode === "move") {
    o.move.forEach((s) => (m[s] = "dot"));
    o.capture.forEach((s) => (m[s] = "ring"));
  } else if (S.mode === "split") {
    o.split.forEach((s) => (m[s] = S.picks.includes(s) ? "picked" : "qdot"));
  } else if (!S.partner) {
    Object.keys(o.merge).forEach((s) => (m[s] = "partner"));
  } else {
    m[S.partner] = "partner";
    o.merge[S.partner].forEach((s) => (m[s] = "qdot"));
  }
  return m;
}

function renderPanel() {
  const st = S.state;
  const winnerName = st.winner === "w" ? "White" : "Black";
  $("status").textContent = st.winner ? (st.winner === "draw" ? "Draw" : `${winnerName} wins`) : `${st.turn === "w" ? "White" : "Black"} to move`;
  $("qubits").textContent = `${st.qubits} qubit${st.qubits === 1 ? "" : "s"}`;
  const whiteBottom = !settings.flip;
  $("dotBottom").classList.toggle("on", !st.winner && st.turn === (whiteBottom ? "w" : "b"));
  $("dotTop").classList.toggle("on", !st.winner && st.turn === (whiteBottom ? "b" : "w"));
  $("modeTag").textContent = st.quantum ? "5×5 · quantum" : "5×5 · classical";
  $("hint").textContent = hintText();
  renderMoves();
  renderCaptured(whiteBottom);
  const ov = $("overlay");
  if (st.winner) {
    $("overlayTitle").textContent = st.winner === "draw" ? "Draw" : `${winnerName} wins`;
    $("overlaySub").textContent = st.winner === "draw" ? "No legal moves left." : "The king was captured.";
    ov.classList.remove("hidden");
  } else ov.classList.add("hidden");
}

function hintText() {
  if (S.state.winner) return "Game over.";
  if (S.mode === "move") return S.sel ? "Click a dot to move, a ring to capture (captures measure the board)." : "Select a piece to see where it can go.";
  if (S.mode === "split") return S.sel ? `Pick two empty squares (${S.picks.length}/2). The piece ends up on both, 50% each.` : "Select a non-pawn piece to split it across two squares.";
  if (!S.sel) return "Select one half of a split piece.";
  return S.partner ? "Pick the square where both halves should interfere." : "Now click its other half (outlined).";
}

function renderMoves() {
  const ol = $("moves");
  ol.innerHTML = "";
  for (const e of S.state.log) {
    const g = GLYPH[e.piece];
    let text;
    if (e.kind === "split") text = `${g} ${e.from} → ${e.to} + ${e.extra} <i>split</i>`;
    else if (e.kind === "merge") text = `${g} ${e.from} + ${e.extra} → ${e.to} <i>merge</i>`;
    else text = `${g} ${e.from} ${e.kind === "capture" ? "×" : "→"} ${e.to}`;
    const li = document.createElement("li");
    li.innerHTML = `<span class="${e.ok ? "" : "fail"}">${e.color === "w" ? "White" : "Black"}: ${text}</span>`
      + e.events.map((ev) => `<span class="ev">${ev}</span>`).join("");
    ol.appendChild(li);
  }
  ol.scrollTop = ol.scrollHeight;
}

function renderCaptured(whiteBottom) {
  const alive = new Set(S.state.squares.filter((s) => s.piece).map((s) => s.piece.pid));
  const lost = { w: [], b: [] };
  ["R", "N", "B", "Q", "K"].forEach((k, f) => {
    for (const c of ["w", "b"]) {
      if (!alive.has(`${c}${k}${FILES[f]}`)) lost[c].push(c + k);
      if (!alive.has(`${c}P${FILES[f]}`)) lost[c].push(c + "P");
    }
  });
  const icons = (list) => list.map((s) => `<span style="background-image:url(${pieceUrl(s[0], s[1])})"></span>`).join("");
  // each bar shows what that player has captured
  $(whiteBottom ? "capBottom" : "capTop").innerHTML = icons(lost.b);
  $(whiteBottom ? "capTop" : "capBottom").innerHTML = icons(lost.w);
}

function flashMeasured(entry) {
  if (!entry || !settings.anim) return;
  for (const ev of entry.events) {
    const m = ev.match(/measured ([a-e][1-5])/);
    const el = m && document.querySelector(`#board .sq[data-sq="${m[1]}"]`);
    if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
}

function showCircuit() {
  const box = $("circuit");
  const node = S.engine.circuit(S.state);
  if (!node) { box.innerHTML = `<span class="muted">Classical move: no qubits were needed.</span>`; return; }
  box.innerHTML = "";
  if (typeof node === "string") box.innerHTML = node;
  else {
    box.innerHTML = `<span class="muted">Drawing circuit…</span>`;
    node.onload = () => { box.innerHTML = ""; box.appendChild(node); };
    node.onerror = () => { box.innerHTML = `<span class="muted">Circuit drawing unavailable.</span>`; };
  }
}

// ================================================================== circuit drawing (in-browser engine)
function circuitSVG(trace) {
  const wires = [];
  const touch = (s) => { if (!wires.includes(s)) wires.push(s); };
  trace.forEach((t) => (t.op === "gate" ? [...t.controls, ...t.squares] : [t.sq]).forEach(touch));
  const inited = new Set(trace.filter((t) => t.op === "init").map((t) => t.sq));
  const cols = [];
  wires.filter((w) => !inited.has(w)).forEach((w) => cols.push({ kind: "psi", wire: w }));
  trace.forEach((t) => {
    if (t.op === "init") { if (t.occupied) cols.push({ kind: "x", wire: t.sq }); }
    else cols.push(t);
  });
  // pack single-qubit boxes on different wires into the same column
  const layout = [];
  for (const c of cols) {
    const rows = c.op === "gate" ? [...c.controls, ...c.squares].map((s) => wires.indexOf(s)) : [wires.indexOf(c.wire ?? c.sq)];
    const lo = Math.min(...rows), hi = Math.max(...rows);
    const prev = layout[layout.length - 1];
    const single = c.kind === "psi" || c.kind === "x";
    if (prev && single && prev.single && !prev.rows.has(lo)) { prev.items.push({ c, lo, hi }); prev.rows.add(lo); }
    else layout.push({ single, rows: new Set([lo]), items: [{ c, lo, hi }] });
  }
  const W = 46, X0 = 56, ROW = 44, Y0 = 26, colW = 76;
  const width = X0 + layout.length * colW + 20, height = Y0 + wires.length * ROW;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" font-family="Segoe UI, Arial, sans-serif">`;
  wires.forEach((w, i) => {
    const y = Y0 + i * ROW;
    svg += `<text x="8" y="${y + 5}" font-size="15" font-style="italic" fill="#161616">${w}</text>`;
    svg += `<line x1="${X0 - 10}" y1="${y}" x2="${width - 8}" y2="${y}" stroke="#161616" stroke-width="1.2"/>`;
  });
  layout.forEach((col, ci) => {
    const cx = X0 + ci * colW + colW / 2;
    for (const { c, lo, hi } of col.items) {
      const ylo = Y0 + lo * ROW, yhi = Y0 + hi * ROW;
      if (c.kind === "psi" || c.kind === "x") {
        const fill = c.kind === "x" ? "#002d9c" : "#8d8d8d";
        svg += `<rect x="${cx - 16}" y="${ylo - 16}" width="32" height="32" fill="${fill}"/>`;
        svg += `<text x="${cx}" y="${ylo + 5}" font-size="14" fill="#fff" text-anchor="middle">${c.kind === "x" ? "X" : "ψ"}</text>`;
      } else if (c.op === "measure") {
        svg += `<rect x="${cx - 18}" y="${ylo - 16}" width="36" height="32" fill="#8d8d8d"/>`;
        svg += `<path d="M ${cx - 11} ${ylo + 7} A 11 11 0 0 1 ${cx + 11} ${ylo + 7}" stroke="#fff" fill="none" stroke-width="1.6"/>`;
        svg += `<line x1="${cx}" y1="${ylo + 7}" x2="${cx + 8}" y2="${ylo - 8}" stroke="#fff" stroke-width="1.6"/>`;
        svg += `<text x="${cx}" y="${ylo + 30}" font-size="12" fill="#6f6f6f" text-anchor="middle">= ${c.result}</text>`;
      } else {
        const tg = c.squares.map((s) => Y0 + wires.indexOf(s) * ROW);
        const top = Math.min(...tg), bot = Math.max(...tg);
        svg += `<line x1="${cx}" y1="${ylo}" x2="${cx}" y2="${yhi}" stroke="#9f1853" stroke-width="2"/>`;
        c.controls.forEach((s) => {
          const y = Y0 + wires.indexOf(s) * ROW;
          svg += `<circle cx="${cx}" cy="${y}" r="7" fill="#fff" stroke="#9f1853" stroke-width="2"/>`;
        });
        svg += `<rect x="${cx - W / 2 - 8}" y="${top - 17}" width="${W + 16}" height="${bot - top + 34}" fill="#9f1853"/>`;
        svg += `<text x="${cx}" y="${(top + bot) / 2 + 5}" font-size="13" fill="#fff" text-anchor="middle">${c.gate}</text>`;
      }
    }
  });
  return svg + "</svg>";
}

// ================================================================== charts (blog)
function barChart(rows, { max = null, unit = "", color = "#0f62fe" } = {}) {
  const top = max ?? Math.max(...rows.map((r) => r.value)) * 1.15;
  return `<div class="bars">${rows.map((r) => `
    <div class="bar-row"><div class="bar-label">${r.label}</div>
      <div class="bar-track"><div class="bar" style="width:${(100 * r.value) / top}%;background:${r.color || color}"></div></div>
      <div class="bar-value">${r.text ?? r.value + unit}</div></div>`).join("")}</div>`;
}

function lineChart(points, { xLabel = "", yLabel = "", color = "#a970ff" } = {}) {
  const W = 560, H = 240, L = 48, B = 36, T = 12, R = 16;
  const xs = points.map((p) => p[0]), xmax = Math.max(...xs);
  const px = (x) => L + (x / xmax) * (W - L - R), py = (y) => T + (1 - y) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${yLabel} vs ${xLabel}">`;
  for (const y of [0, 0.25, 0.5, 0.75, 1]) {
    s += `<line x1="${L}" x2="${W - R}" y1="${py(y)}" y2="${py(y)}" class="grid"/>`;
    s += `<text x="${L - 8}" y="${py(y) + 4}" text-anchor="end" class="tick">${y.toFixed(2)}</text>`;
  }
  for (const x of xs) s += `<text x="${px(x)}" y="${H - B + 18}" text-anchor="middle" class="tick">${x * 100}%</text>`;
  s += `<polyline fill="none" stroke="${color}" stroke-width="2.5" points="${points.map((p) => `${px(p[0])},${py(p[1])}`).join(" ")}"/>`;
  for (const p of points) s += `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="4.5" fill="${color}"><title>${p[0] * 100}% error: ${p[1].toFixed(3)}</title></circle>`;
  s += `<text x="${(W + L) / 2}" y="${H - 4}" text-anchor="middle" class="axis">${xLabel}</text>`;
  return s + "</svg>";
}

// ================================================================== routing
function route() {
  const r = (location.hash || "#play").slice(1);
  const view = ["play", "manual", "blog"].includes(r) ? r : "play";
  for (const v of ["play", "manual", "blog"]) $("view-" + v).classList.toggle("hidden", v !== view);
  document.querySelectorAll(".nav a").forEach((a) => a.classList.toggle("active", a.dataset.route === view));
  if (view === "manual" && !$("manualBody").dataset.built) { buildManual($("manualBody")); $("manualBody").dataset.built = 1; }
  if (view === "blog" && !$("blogBody").dataset.built) { buildBlog($("blogBody")); $("blogBody").dataset.built = 1; }
  window.scrollTo(0, 0);
}

// ================================================================== wiring
function wire() {
  document.querySelectorAll(".mode").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
  $("newQuantum").addEventListener("click", () => newGame(true));
  $("newClassical").addEventListener("click", () => newGame(false));
  $("overlayNew").addEventListener("click", () => newGame(S.state ? S.state.quantum : true));
  $("settingsBtn").addEventListener("click", () => $("settings").showModal());

  $("themes").innerHTML = THEMES.map((t) => `
    <button class="theme-card" data-theme="${t.id}">
      <span class="theme-preview" style="background:conic-gradient(${t.dark} 0 25%, ${t.light} 0 50%, ${t.dark} 0 75%, ${t.light} 0)"></span>
      <span>${t.label}</span></button>`).join("");
  document.querySelectorAll(".theme-card").forEach((b) => b.addEventListener("click", () => {
    settings.theme = b.dataset.theme; saveSettings(); applySettings();
  }));
  document.querySelectorAll("[data-setting]").forEach((el) => el.addEventListener("change", () => {
    settings[el.dataset.setting] = el.checked; saveSettings(); applySettings();
  }));
  document.querySelectorAll("input[name=engine]").forEach((el) => el.addEventListener("change", async () => {
    settings.engine = el.value; saveSettings();
    await chooseEngine();
    await newGame(true);
    toast(`Engine: ${S.engine.label}. A new game was started.`);
  }));
  $("resetSettings").addEventListener("click", () => { settings = { ...DEFAULTS }; saveSettings(); applySettings(); });

  document.addEventListener("keydown", (e) => {
    if ($("settings").open || (location.hash && location.hash !== "#play")) return;
    if (e.key === "Escape") { clearSelection(); render(); }
    if (e.key === "1") setMode("move");
    if (e.key === "2") setMode("split");
    if (e.key === "3") setMode("merge");
  });
  window.addEventListener("hashchange", route);
}

(async function main() {
  loadSettings();
  wire();
  applySettings();
  route();
  await chooseEngine();
  await newGame(true);
})();

</script>
